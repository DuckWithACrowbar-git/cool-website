<body>
    <h2>Slow down!</h2>
    <h4>You're sending too many requests and have been temporarily banned for one minute.</h4>
    <h4>A button will appear to return you in <span id="countdown-timer">60</span> seconds</h4>
    <div id="go_back" style="display: none;">
        <h6>If you press the button below, you agree to not hit the rate limit again.</h6>
        <button type="button" onclick="window.location.reload();">Go back</button>
    </div>

<style>
    html{
        background-color: black;
        animation-name: red-black-flash;
        animation-duration: 1.5s;
        animation-iteration-count: 3;
    }
    body{
        color: white;
        padding-left: 50px;
        padding-top: 50px;
        font-size: 150%;
    }
    input{
        margin-top: 100px;
    }
    .refresh-button{
        opacity: 0;
        display: block;
        font-size: 111%;
        padding: 5px;
        margin-top: 20px;
    }

    /* Keyframe stuff here */
    @keyframes red-black-flash {
        0% {background-color: black;}
        50% {background-color: red;}
        100% {background-color: black;}
    }
</style>
<script>
    let timeLeft = 60;
    const timerDisplay = document.getElementById('countdown-timer');
    const countdown = setInterval(() => {
        timeLeft--;
        timerDisplay.textContent = timeLeft;
        if (timeLeft <= 0) {
            clearInterval(countdown);
            const button = document.getElementById("go_back");
            button.style.display = "block"; 
        }
    }, 1000); // 1000 milliseconds = 1 second
</script>
