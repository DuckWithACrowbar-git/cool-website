    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <!-- <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> -->
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@500&display=swap" rel="stylesheet">
</head>
<body>
    <h1 class="main-title center" id="trackTitle">Radio Station Live</h1>
    <main class="wrap" role="main">
        <section>
            <div class="now" aria-live="polite">
                <div class="meta">
                    <p class="subtitle" id="trackArtist">24/7 Music & Shows</p>
                </div>
            <div class="main">    
                <audio id="audio-" controls autoplay hidden src="{{ url_for('static', filename='songs/' + song.file) }}" type="audio/mpeg"></audio>
                <div class="controls" role="group" aria-label="Player controls">
                <button class="btn play" id="playBtn" aria-pressed="false">▶ Play</button>
                <button class="btn" id="pauseBtn">■ Stop</button>
                <div style="margin-top:12px;color:var(--muted);font-size:0.95rem">
                    <strong>Now Playing:</strong> <span id="nowText">{{song.title}} - {{song.author}}</span>
                </div>
                <div><button class="change" type="button" onclick="window.location.reload();">Change channel</button></div>   
            </div>
        </div>
    </section>
  </main>
</body>
</html>
<style>
    html{
        font-family: "Ubuntu", sans-serif;
        font-weight: 500;
        font-style: normal;
        background-color: black;
    }
    body{
        color: white;
    }
    .invisible{
        opacity: 0;
    }
    .center{
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .wrap{
        padding-left: 75px;
        padding-top: 25px;
    }
    .main-title{
        font-size: 350%;
    }
    .subtitle{
        font-size: 150%;
    }
    .btn{
        padding: 10px;
        border: 5px black solid;
        border-radius: 10px;
    }
    strong{
        font-size: 175%;
    }
    #nowText{
        font-size: 150%;
        padding-left: 10px;
    }
    .change{
        margin-top: 30px;
        font-size: 125%;
        padding: 5px;
    }
</style>
<script>
    const audio = document.getElementById('audio-');
    const playButton = document.getElementById('playBtn');
    const pauseButton = document.getElementById('pauseBtn');
    playButton.addEventListener('click', () => {audio.play();});
    pauseButton.addEventListener('click', () => {audio.pause();});
</script>
