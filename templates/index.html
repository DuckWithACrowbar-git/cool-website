<!DOCTYPE html>
<html lang="en">
<head>
    <title>Random number generator</title>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <!-- <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> -->
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@500&display=swap" rel="stylesheet">
</head>
<body>
    <div><h1>Random number generator</h1></div>
    <div><h2>Random number: <span id="num">-</span></h2></div>
    <div><button type="button" onclick="window.location.reload();">Generate new number</button></div>
</body>
</html>
<style>
    html{
        font-family: "Ubuntu", sans-serif;
        font-weight: 500;
        font-style: normal;
        background-color: black;
    }
    body{
        color: white;
    }
    div{
        display: flex;
        justify-content: center;
        align-items: center;
    }
    h1{
        transform: scale(1.5);
    }
    button{
        margin-top: 100px;
        transform: scale(1.3);
    }
</style>
<script>
      const endpoint = '/random';
      const elNum = document.getElementById('num');

      async function showRandom() {
        try {
          const res = await fetch(endpoint, { method: 'GET', headers: { 'Accept': 'application/json' } });
          if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
          const text = await res.text();

          let value;
          try {
            const parsed = JSON.parse(text);
            if (typeof parsed === 'number') value = parsed;
            else if (parsed && typeof parsed === 'object') {
              value = parsed.number ?? parsed.value ?? parsed.random ?? JSON.stringify(parsed);
            } else {
              value = parsed;
            }
          } catch {
            value = text;
          }
          elNum.textContent = String(value);
        } catch (err) {
          elNum.textContent = 'Error';
          console.error(err);
        }
      }
      showRandom();
</script>
